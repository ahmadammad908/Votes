version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusface_user
      POSTGRES_PASSWORD: campusface_secret_pass
      POSTGRES_DB: campusface_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusface_user -d campusface_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusface-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: campusface-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://campusface_user:campusface_secret_pass@postgres:5432/campusface_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super_secret_jwt_key_at_least_32_characters_long_for_prod"
      JWT_REFRESH_SECRET: "super_secret_refresh_jwt_key_32_characters_long_prod"
      COOKIE_SECRET: "super_secret_cookie_signing_key_32_chars_long"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: campusface-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
